name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build

      # The spec runs against `next start`, which the Playwright config boots.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test
